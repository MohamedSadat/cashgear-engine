[package]
name = "platformer_android"
description = "The platformer's Android library: the entry point the APK's activity loads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `libplatformer_android.so`, built by cargo-ndk from the Gradle build next to this file.
# On other targets it is an empty library.
[lib]
crate-type = ["cdylib"]

[dependencies]
cashgear_engine = { workspace = true, default-features = false }
# No debug overlay on phones: it is driven by keys.
platformer = { path = "..", default-features = false }

[lints]
workspace = true
