[package]
name = "platformer"
description = "CashGear Engine sample game: a short 2D platformer in three levels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["overlay"]
# The F12 debug overlay (egui). The web release leaves it out: `--no-default-features`.
overlay = ["cashgear_engine/debug-overlay"]

[dependencies]
# Scripts: the walkers and checkpoints run in Lua where Lua runs (not on the web).
cashgear_engine = { workspace = true, default-features = false, features = ["script"] }
# The save file and the controls are RON through serde, like the engine's settings.
ron.workspace = true
serde.workspace = true

[dev-dependencies]
# The ignored `capture_screens` test renders the screens offscreen.
pollster.workspace = true

[lints]
workspace = true
