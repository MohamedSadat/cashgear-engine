name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check

  check:
    name: clippy, test, wasm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        # libudev for gilrs; Xvfb and xkbcommon-x11 for the headless example run.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-x11-0 xvfb
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm check
        run: cargo clippy-wasm
      - name: examples (--frames)
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run cargo run -p hello_window -- --frames 60
