name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check
      - name: the version, the template's engine tag and the changelog agree
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          python3 tools/release.py check "v$version"

  check:
    name: clippy, test, wasm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        # libudev for gilrs; ALSA headers for cpal (audio); Xvfb and xkbcommon-x11 for the
        # headless example runs; Mesa's lavapipe gives the GPU-less runner a software Vulkan
        # device. Windows runners use Direct3D 12's WARP software adapter instead.
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libasound2-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # Reference-image tests fail instead of skipping when no adapter is found.
        env:
          CG_REQUIRE_GPU: "1"
        run: cargo test --workspace
      - name: wasm check
        run: cargo clippy-wasm
      - name: examples (--frames)
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run cargo run -p hello_window -- --frames 60
          run cargo run -p bunnymark -- --frames 120
          run cargo run -p bunnymark -- --frames 120 --ecs
          run cargo run -p ecs_sprites -- --frames 480 --demo
          run cargo run -p tiled_map -- --frames 360 --demo
          # No frame limit: the bot exits by itself, with an error if it fails the course.
          run cargo run -p collision -- --demo --physics-debug
          # The same for the animation bot, which also visits the particle gallery.
          run cargo run -p animation -- --demo
          # The audio bot. A runner without a sound card cannot open the device; the game
          # then runs silent, which this checks too.
          run cargo run -p audio -- --demo
          # The UI bot clicks through every screen (both languages, settings, play, pause)
          # with the touch controls and the debug overlay's renderer in the frame.
          run cargo run -p ui -- --demo --overlay
          # The platformer's bot plays the whole game, from the title screen through the
          # three levels to the final screen, and quits; it exits with an error if it gets
          # stuck or loses a level. Its walkers and checkpoints are Lua scripts here.
          run cargo run -p platformer -- --demo
          # The same game with the Rust walkers and checkpoints (as on the web).
          run cargo run -p platformer -- --demo --no-scripts
          # A level that is all Lua, bot included, with the overlay's Scripts window; it
          # exits with an error if a script fails or the bot misses the goal.
          run cargo run -p scripting -- --demo --overlay
          # The scene editor with the platformer built in: it moves an object, undoes and
          # redoes, places a tile, edits a property, saves into a scratch folder, plays
          # level 1 and stops, checking each step; it exits with an error if one fails.
          run cargo run -p platformer_editor -- --demo
          # The editor on its own, playing the scripting example's level with its prefabs.
          run cargo run -p cg_editor -- --asset-root examples/scripting/assets maps/playground.tmx --demo
      - name: committed atlases are up to date
        run: >-
          cargo run -p cg_pack -- atlas examples/tiled_map/art/characters
          examples/tiled_map/assets/atlases/characters.atlas.ron --check
      - name: reference images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.os }}
          path: target/golden/
          if-no-files-found: ignore

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        # The bundle hook runs cg_pack, which builds the engine natively: libudev for
        # gilrs, ALSA headers for cpal.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: build the platformer for the web
        # The web-release profile, wasm-opt, no debug overlay, and the assets in one
        # bundle (the post_build hook in Trunk.toml). Relative URLs, so the same files work
        # on GitHub Pages and itch.io.
        working-directory: games/platformer
        run: trunk build --release --no-default-features --public-url ./
      - name: download size
        # What a player downloads: code and text gzipped (as GitHub Pages and most hosts
        # serve them), images and the bundle as they are (already compressed). The job
        # fails above the 8 MB budget.
        shell: bash
        working-directory: games/platformer/dist
        run: |
          # trunk's empty lock file is not part of the game.
          rm -f .trunk-lock
          budget=8000000
          total=0
          {
            echo "### Web download size"
            echo
            echo "| File | Bytes | Transferred |"
            echo "| --- | ---: | ---: |"
            while IFS= read -r file; do
              bytes=$(stat -c %s "$file")
              case "$file" in
                *.wasm|*.js|*.mjs|*.html|*.css|*.json|*.webmanifest) sent=$(gzip -9 -c "$file" | wc -c) ;;
                *) sent=$bytes ;;
              esac
              total=$((total + sent))
              echo "| \`${file#./}\` | $bytes | $sent |"
            done < <(find . -type f | sort)
            echo "| **Total** | | **$total** (budget $budget) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt "$budget" ]; then
            echo "::error::the web build downloads $total bytes, over the $budget budget"
            exit 1
          fi
      - name: zip for itch.io
        # The artifact's zip has index.html at its root, as itch.io wants.
        uses: actions/upload-artifact@v7
        with:
          name: platformer-web
          path: games/platformer/dist/

  android:
    name: android build
    runs-on: ubuntu-latest
    env:
      # Release signing, if the repository has the secrets (see
      # games/platformer/android/README.md); without them the AAB is unsigned.
      HAS_KEYSTORE: ${{ secrets.CG_ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        # The asset bundle is made by cg_pack, which builds the engine natively: libudev for
        # gilrs, ALSA headers for cpal.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      # Installs the Android targets listed in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Android SDK packages
        # The runner has the SDK; these are the versions the Gradle build names.
        run: >-
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" > /dev/null
      - name: clippy (Android)
        run: cargo clippy-android
      - name: release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.CG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CG_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: build the APK and the AAB
        # A debug APK (arm64 and x86_64) to install by hand or on an emulator, and the
        # release AAB (arm64, armeabi-v7a and x86_64) for Google Play.
        working-directory: games/platformer/android
        env:
          CG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CG_ANDROID_KEYSTORE_PASSWORD }}
          CG_ANDROID_KEY_ALIAS: ${{ secrets.CG_ANDROID_KEY_ALIAS }}
          CG_ANDROID_KEY_PASSWORD: ${{ secrets.CG_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - name: sizes
        shell: bash
        working-directory: games/platformer/android/app/build/outputs
        run: |
          {
            echo "### Android build sizes"
            echo
            echo "| File | Bytes |"
            echo "| --- | ---: |"
            find . -name '*.apk' -o -name '*.aab' | sort | while IFS= read -r file; do
              echo "| \`${file#./}\` | $(stat -c %s "$file") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: platformer-android
          path: |
            games/platformer/android/app/build/outputs/apk/debug/*.apk
            games/platformer/android/app/build/outputs/bundle/release/*.aab

  template:
    name: game template
    # Makes a game from templates/game as `cargo generate` would, points it at this
    # checkout instead of the release tag, and checks it like the template's own CI:
    # formatting, lints, the bot test and the web build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - name: generate a game
        run: |
          cargo generate --path templates/game --name ci-game --destination "$RUNNER_TEMP" \
            -d title="CI Game" -d app_id=com.example.cigame --silent --vcs none
          cd "$RUNNER_TEMP/ci-game"
          sed -i -E \
            -e "s#^cashgear_engine = \{ git = \"[^\"]+\", tag = \"[^\"]+\"#cashgear_engine = { path = \"$GITHUB_WORKSPACE/crates/cashgear_engine\"#" \
            -e "s#^cg_editor = \{ git = \"[^\"]+\", tag = \"[^\"]+\" \}#cg_editor = { path = \"$GITHUB_WORKSPACE/tools/cg_editor\" }#" \
            Cargo.toml
          grep -n "^cashgear_engine = \|^cg_editor = " Cargo.toml
      - name: check it
        working-directory: ${{ runner.temp }}/ci-game
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo check --target wasm32-unknown-unknown -p ci_game --no-default-features

  bench:
    name: benchmarks
    # One frame of each cg_bench scene, timed; the table goes in the run's summary. Shared
    # runners are noisy, so the times are reported, not judged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo bench -p cg_bench --bench frames -- --noplot
      - run: python3 benches/report.py target/criterion >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: guide and API docs
    # The site GitHub Pages serves: the platformer's web release at the root, the mdBook
    # guide under book/ and the API docs under api/.
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: API docs
        # Broken links in the docs fail the job.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >-
          cargo doc --no-deps --features cashgear_engine/script
          -p cashgear_engine -p cg_core -p cg_platform -p cg_render -p cg_world -p cg_assets
          -p cg_tiled -p cg_physics -p cg_anim -p cg_audio -p cg_ui -p cg_script -p cg_editor
      - name: the guide
        run: mdbook build docs/book
      - uses: actions/download-artifact@v8
        with:
          name: platformer-web
          path: site
      - name: assemble the site
        run: |
          rm -f site/.trunk-lock
          cp -r docs/book/book site/book
          cp -r target/doc site/api
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>CashGear Engine API</title><meta http-equiv="refresh" content="0; url=cashgear_engine/index.html"><a href="cashgear_engine/index.html">CashGear Engine API</a>' > site/api/index.html
          du -sh site site/book site/api
      - name: pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  pages:
    name: deploy to GitHub Pages
    # Only a green main is published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, check, web, android, template, docs]

    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
