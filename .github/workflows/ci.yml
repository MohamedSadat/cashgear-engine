name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check

  check:
    name: clippy, test, wasm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        # libudev for gilrs; Xvfb and xkbcommon-x11 for the headless example runs; Mesa's
        # lavapipe gives the GPU-less runner a software Vulkan device. Windows runners use
        # Direct3D 12's WARP software adapter instead.
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # Reference-image tests fail instead of skipping when no adapter is found.
        env:
          CG_REQUIRE_GPU: "1"
        run: cargo test --workspace
      - name: wasm check
        run: cargo clippy-wasm
      - name: examples (--frames)
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          run cargo run -p hello_window -- --frames 60
          run cargo run -p bunnymark -- --frames 120
          run cargo run -p bunnymark -- --frames 120 --ecs
          run cargo run -p ecs_sprites -- --frames 480 --demo
          run cargo run -p tiled_map -- --frames 360 --demo
          # No frame limit: the bot exits by itself, with an error if it fails the course.
          run cargo run -p collision -- --demo --physics-debug
          # The same for the animation bot, which also visits the particle gallery.
          run cargo run -p animation -- --demo
      - name: committed atlases are up to date
        run: >-
          cargo run -p cg_pack -- atlas examples/tiled_map/art/characters
          examples/tiled_map/assets/atlases/characters.atlas.ron --check
      - name: reference images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.os }}
          path: target/golden/
          if-no-files-found: ignore
