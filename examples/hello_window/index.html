<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>CashGear: hello_window</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="hello_window" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d1f24;
      }
      /* The canvas fills the page; the engine reads its size from winit. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      p {
        position: absolute;
        top: 0;
        left: 0;
        margin: 16px;
        color: #c9ccd3;
        font: 14px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="cashgear"></canvas>
    <p>hello_window: press keys, click, touch or use a gamepad, and watch the browser console.</p>
  </body>
</html>
