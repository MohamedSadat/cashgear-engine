[package]
name = "cashgear_engine"
description = "CashGear Engine: a 2D game engine for desktop, web and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["debug-overlay"]
# The egui debug overlay (F12): frame times, render stats, entities and components.
debug-overlay = ["cg_ui/debug-overlay", "cg_script?/debug-overlay"]
# Lua scripting (`cg_script` and `ScriptPlugin` in `DefaultPlugins`). Scripts run on desktop
# and Android; on the web the plugin is there but runs nothing (see `cg_script`).
script = ["dep:cg_script"]

[dependencies]
cg_anim.workspace = true
cg_assets.workspace = true
cg_audio.workspace = true
cg_core.workspace = true
cg_physics.workspace = true
cg_platform.workspace = true
cg_render.workspace = true
cg_script = { workspace = true, optional = true }
cg_tiled.workspace = true
cg_ui = { workspace = true, default-features = false }
cg_world.workspace = true

# Lua itself everywhere but the web: mlua builds for wasm32-unknown-emscripten, not for the
# wasm32-unknown-unknown target the web build uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cg_script = { workspace = true, optional = true, features = ["lua"] }

[lints]
workspace = true
