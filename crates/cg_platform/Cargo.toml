[package]
name = "cg_platform"
description = "CashGear Engine platform layer: windowing, input, asset IO, storage and lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Direct dependency so bevy's derive macros (`Resource`, `Message`) can find `bevy_ecs`.
bevy_ecs.workspace = true
cg_core.workspace = true
gilrs.workspace = true
glam = { workspace = true, features = ["serde"] }
log.workspace = true
serde.workspace = true
web-time.workspace = true
winit = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Window"] }

[dev-dependencies]
ron.workspace = true

[lints]
workspace = true
