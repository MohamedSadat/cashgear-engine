[package]
name = "cg_platform"
description = "CashGear Engine platform layer: windowing, input, asset IO, storage and lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Direct dependency so bevy's derive macros (`Resource`, `Message`) can find `bevy_ecs`.
bevy_ecs.workspace = true
cg_core.workspace = true
gilrs.workspace = true
glam = { workspace = true, features = ["serde"] }
log.workspace = true
miniz_oxide.workspace = true
serde.workspace = true
web-time.workspace = true
winit = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# Hot reloading watches the asset folder; Android reads from the APK instead. Android logs
# to logcat.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger.workspace = true
notify.workspace = true

# winit drives Android's NativeActivity (through android-activity); the engine's Java
# activity keeps a little state that is read through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["CustomEvent", "CustomEventInit", "Document", "Element", "Event", "EventTarget", "Headers", "HtmlCanvasElement", "HtmlElement", "Location", "MediaQueryList", "Response", "Storage", "Window"] }

[dev-dependencies]
ron.workspace = true

[lints]
workspace = true
