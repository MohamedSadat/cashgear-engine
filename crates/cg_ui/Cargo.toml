[package]
name = "cg_ui"
description = "CashGear Engine UI: text, runtime game UI, touch controls and the egui debug overlay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["debug-overlay"]
# The egui debug overlay: frame times, render stats, entities and their components, and
# debug drawing toggles.
# With bevy's `debug` feature the inspector can name component types.
debug-overlay = ["dep:egui", "dep:egui-wgpu", "bevy_ecs/debug"]
# Profiling with puffin, and with `debug-overlay` the overlay's Profiler window.
profile = ["cg_core/profile", "dep:puffin"]

[dependencies]
# Direct dependency so bevy's derive macros (`Component`) can find `bevy_ecs`.
bevy_ecs.workspace = true
cg_assets.workspace = true
cg_core.workspace = true
# For the collider toggle in the debug overlay.
cg_physics.workspace = true
cg_platform.workspace = true
cg_render.workspace = true
cg_world.workspace = true
cosmic-text.workspace = true
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
log.workspace = true
profiling.workspace = true
puffin = { workspace = true, optional = true }
# String tables and font settings.
ron.workspace = true
serde.workspace = true
unicode-script.workspace = true

# There are no threads on wasm32-unknown-unknown, so the egui renderer may be `Send + Sync`
# there and live in a resource, as wgpu's types do.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { workspace = true, optional = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
