[package]
name = "cg_render"
description = "CashGear Engine renderer: wgpu context, sprite batching, camera and debug shapes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Direct dependency so bevy's derive macros (`Resource`) can find `bevy_ecs`.
bevy_ecs.workspace = true
bytemuck.workspace = true
cg_assets.workspace = true
cg_core.workspace = true
cg_platform.workspace = true
cg_world.workspace = true
image.workspace = true
log.workspace = true
# Texture atlas files.
ron.workspace = true
serde.workspace = true
wgpu.workspace = true

# On the web, wgpu tries WebGPU first and falls back to WebGL2. There are no threads on
# wasm32-unknown-unknown, so wgpu's types may be `Send + Sync` there and live in resources.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
