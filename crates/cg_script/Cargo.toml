[package]
name = "cg_script"
description = "CashGear Engine scripting: Lua runtime and bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The Lua 5.4 runtime. Without it the crate still builds (for the web, where mlua cannot)
# and scripts never run. The facade turns it on for every target but wasm32.
lua = ["dep:mlua"]
# The Scripts window in the egui debug overlay, and opening the overlay on script errors.
debug-overlay = ["dep:cg_ui", "cg_ui/debug-overlay"]

[dependencies]
# Direct dependency so bevy's derive macros (`Component`) can find `bevy_ecs`.
bevy_ecs.workspace = true
cg_anim.workspace = true
cg_assets.workspace = true
cg_audio.workspace = true
cg_core.workspace = true
cg_physics.workspace = true
cg_platform.workspace = true
cg_render.workspace = true
cg_tiled.workspace = true
cg_ui = { workspace = true, default-features = false, optional = true }
cg_world.workspace = true
log.workspace = true
mlua = { workspace = true, optional = true }
serde.workspace = true

[lints]
workspace = true
