[workspace]
resolver = "3"
# `games/platformer/android` is the platformer's Android entry point (a cdylib).
members = ["crates/*", "examples/*", "games/*", "games/platformer/android", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MohamedSadat/cashgear-engine"
publish = false

# Internal crates. External dependencies are pinned here too, starting in Phase 1;
# upgrade them only between phases.
[workspace.dependencies]
cashgear_engine = { path = "crates/cashgear_engine" }
cg_anim = { path = "crates/cg_anim" }
cg_assets = { path = "crates/cg_assets" }
cg_audio = { path = "crates/cg_audio" }
cg_core = { path = "crates/cg_core" }
cg_physics = { path = "crates/cg_physics" }
cg_platform = { path = "crates/cg_platform" }
cg_render = { path = "crates/cg_render" }
cg_script = { path = "crates/cg_script" }
cg_tiled = { path = "crates/cg_tiled" }
cg_ui = { path = "crates/cg_ui" }
cg_world = { path = "crates/cg_world" }

# External dependencies.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
# Text shaping (harfrust), bidirectional text, line breaking and glyph rasterizing
# (swash). No system fonts: games ship theirs, which works the same on every target.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# The debug overlay, drawn with our own wgpu device.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
env_logger = "0.11.11"
erased-serde = "0.4.11"
gilrs = "0.11.2"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
js-sys = "0.3.106"
# Android: reading the state the engine's Java activity keeps (back presses, the safe
# area). The version cpal already uses there.
jni = "0.22.4"
# Audio device, mixing and buses only: sounds are decoded by symphonia directly.
kira = { version = "0.12.6", default-features = false, features = ["cpal"] }
log = "0.4.34"
# Deflate for asset bundles (`cg_pack bundle` and their reader); already in the tree
# through `tiled` (flate2).
miniz_oxide = "0.9.1"
notify = "8.2.1"
pollster = "1.0.1"
ron = "0.12.3"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# OGG Vorbis and WAV only (Phase 7 decision); pure Rust, builds for wasm.
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
# TMX/TSX only; the default zstd feature is C code that does not build for wasm.
tiled = { version = "0.16.0", default-features = false }
# The script type cosmic-text's font fallback names (cosmic-text does not re-export it).
unicode-script = "0.5.8"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
missing_docs = "warn"

# Dependencies (wgpu, glam, bevy_ecs, image...) are optimised even in dev builds, so debug
# examples run near release speed. The workspace's own crates get light optimisation:
# bevy's generic query code is compiled into them, and at opt-level 0 a 10,000-entity
# scene runs about ten times slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Web releases: pages pick it with `data-cargo-profile-release="web-release"`, so
# `trunk build --release` makes the smallest code (with wasm-opt after it) while desktop
# release builds keep full speed.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# Android releases (the Gradle build's release variant): full speed, LTO, and no debug
# info in the library the APK carries. Function names stay, so panics in logcat read.
[profile.android-release]
inherits = "release"
lto = true
codegen-units = 1
strip = "debuginfo"
