[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "games/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MohamedSadat/cashgear-engine"
publish = false

# Internal crates. External dependencies are pinned here too, starting in Phase 1;
# upgrade them only between phases.
[workspace.dependencies]
cashgear_engine = { path = "crates/cashgear_engine" }
cg_anim = { path = "crates/cg_anim" }
cg_assets = { path = "crates/cg_assets" }
cg_audio = { path = "crates/cg_audio" }
cg_core = { path = "crates/cg_core" }
cg_physics = { path = "crates/cg_physics" }
cg_platform = { path = "crates/cg_platform" }
cg_render = { path = "crates/cg_render" }
cg_script = { path = "crates/cg_script" }
cg_tiled = { path = "crates/cg_tiled" }
cg_ui = { path = "crates/cg_ui" }
cg_world = { path = "crates/cg_world" }

# External dependencies.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
pollster = "1.0.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
missing_docs = "warn"

# Dependencies (wgpu, glam, bevy_ecs, image...) are optimised even in dev builds, so debug
# examples run near release speed while the engine's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
