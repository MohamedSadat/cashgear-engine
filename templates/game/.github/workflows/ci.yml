name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        # libudev for gamepads, ALSA headers for sound.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The bot plays the level without a window.
      - run: cargo test --workspace
      - name: the web build compiles
        run: cargo check --target wasm32-unknown-unknown -p {{crate_name}} --no-default-features
